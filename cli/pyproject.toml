[project]
name = "ap-monitor-cli"
version = "0.1.0"
description = "Command-line interface for AP Monitor"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
ap-monitor = "ap_monitor_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ap_monitor_cli*"]
